name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      # openwakeword requires tflite-runtime (<3,>=2.8.0), which only ships
      # wheels for CPython 3.8-3.11; newer interpreters cannot resolve it.
      python_versions: '["3.10", "3.11"]'
      install_extras: 'test'
      test_path: 'test'
