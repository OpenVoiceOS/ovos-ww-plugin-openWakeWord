[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ww-plugin-openwakeword"
dynamic = ["version"]
description = "A wakeword plugin for OpenVoiceOS for the openWakeWord library"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "dscripka", email = "david.scripka@gmail.com"}]
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    # openwakeword's own PyPI metadata requires tflite-runtime unconditionally
    # on Linux, and tflite-runtime has no wheels for Python >= 3.12. There is
    # no PEP 508 marker downstream packages can add that removes an upstream
    # package's own unconditional sub-dependency, so this floor is only
    # resolvable on Python < 3.12; see the "py312" extra below for the manual
    # workaround on newer interpreters.
    "openwakeword>=0.5.0,<1; python_version<'3.12'",
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    # This plugin imports numpy unconditionally, so it is always a real
    # dependency. tflite-runtime (required by openwakeword on Linux) ships
    # C-extensions built against the numpy 1.x ABI and crashes under numpy
    # 2.x with "numpy.core.multiarray failed to import", so the <2 ceiling
    # only applies where tflite-runtime is actually installable; on 3.12+
    # (onnx-only path) a modern numpy is fine and required.
    "numpy<2; python_version<'3.12'",
    "numpy; python_version>='3.12'",
]

[project.optional-dependencies]
test = [
    "pytest<9",
    "ovoscope>=0.19.0a1,<1.0.0",
    "ovos-dinkum-listener",
]
# openwakeword>=0.6.0 has no cp312+ wheel path because it unconditionally
# depends on tflite-runtime on Linux, which PyPI only ships up to cp311.
# On interpreters with no tflite-runtime wheel, install openwakeword
# yourself without its declared dependencies, then let this extra provide
# the actual runtime deps it needs for the onnx inference path (which this
# plugin uses automatically when tflite-runtime is unavailable):
#   pip install --no-deps "openwakeword>=0.5.0,<1"
#   pip install "ovos-ww-plugin-openwakeword[onnx]"
onnx = [
    "onnxruntime>=1.10.0,<2",
    "tqdm>=4.0,<5.0",
    "scipy>=1.3,<2",
    "scikit-learn>=1,<2",
    "requests>=2.0,<3",
]

[project.entry-points."opm.wake_word"]
ovos-ww-plugin-openwakeword = "ovos_ww_plugin_openwakeword:OwwHotwordPlugin"

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-ww-plugin-openwakeword"

[tool.setuptools.dynamic]
version = {attr = "ovos_ww_plugin_openwakeword.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_ww_plugin_openwakeword*"]
